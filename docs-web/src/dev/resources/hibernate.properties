hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:mem:docs
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.hbm2ddl.auto=
hibernate.dialect=org.hibernate.dialect.HSQLDialect
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.max_fetch_depth=5
hibernate.cache.use_second_level_cache=false
hibernate.connection.initial_pool_size=1
# hibernate.connection.pool_size is deliberately absent: EMF then applies the adaptive default
# derived from the CPU count (com.sismics.util.ConcurrencySizing), the same size a deployed
# instance gets. The former fixed 10 lost to the app's own async worker count on a many-core dev
# box and reproduced #230 under `mvn jetty:run`. Set DATABASE_POOL_SIZE to pin a value.
hibernate.connection.pool_validation_interval=5
