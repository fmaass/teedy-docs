# Freeze store for the two legacy ratchets (rules 7/8: rest.resource -> core.dao, and
# rest.resource -> ThreadLocalContext). The store is COMMITTED under version control so the
# shrink-only baselines are review-visible. allowStoreCreation is FALSE: the store exists; a missing
# store must FAIL the build (a deleted store silently re-snapshotting would grandfather new
# violations). Seeding a store for a NEW frozen rule requires a one-run flip of this flag, reviewed
# with the resulting store files. refreeze stays false so a NEW violation fails instead of being
# recorded.
freeze.store.default.path=src/test/resources/archunit-freeze
freeze.store.default.allowStoreCreation=false

# allowStoreUpdate is FALSE, and ArchUnit's own default is TRUE: without this key a test run may
# WRITE the store. The default lets any run whose stored violations went obsolete rewrite the store
# files in the SOURCE tree as a side effect -- including a run that is otherwise RED -- so a failing
# build can silently leave a shrunk baseline behind and the committed store stops describing the
# state that was reviewed. With it false, TextFileBasedViolationStore.save() throws
# StoreUpdateFailedException instead of writing. Expected consequence: a genuine shrink (a resource
# really migrated off core.dao / ThreadLocalContext) now FAILS the build until the store is refrozen
# by the procedure below -- the ratchet still only shrinks, but each shrink is a reviewed commit
# instead of a side effect.
#
# Sanctioned refreeze -- the only legitimate way the store content changes:
#   1. Confirm the shrink is real: the removed violations are gone from main sources and the run is
#      otherwise green. Never refreeze to silence a NEW violation.
#   2. Re-run the rule ONCE with the write flag flipped on the command line. System properties
#      prefixed "archunit." override this file, so nothing here is edited:
#        ./mvnw -pl docs-web test -Dtest=DocumentSliceArchitectureTest \
#            -Darchunit.freeze.store.default.allowStoreUpdate=true
#      Add -Darchunit.freeze.store.default.allowStoreCreation=true ONLY when seeding a store for a
#      NEW frozen rule. Never pass -Darchunit.freeze.refreeze=true: that records the CURRENT
#      violations as grandfathered, which is the opposite of the ratchet.
#   3. Review `git diff -- docs-web/src/test/resources/archunit-freeze/`: a shrink may only DELETE
#      lines. Any ADDED line means a new violation was recorded -- discard the store change and fix
#      the code instead.
#   4. Commit the store change together with the code change that caused it.
freeze.store.default.allowStoreUpdate=false

freeze.refreeze=false
